<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireless Headphones</title>
    <style>
        .box {
            width: 28%;
            height: 70%;
            border: 3px solid rgb(207, 202, 202);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            box-shadow: 2px 2px 10px 2px rgb(212, 15, 15);
            background-color: white;
            transition: 0.3s ease;
        }
     
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .image {
            height: 70%;
            width: 100%;
            border-radius: 15px;
            border: 3px solid rgb(207, 202, 202);
            background-image: url("https://th.bing.com/th/id/OIP.Sjw-6541arm7yUHvQKGqcgHaHa?w=195&h=195&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: 0.4s ease;
        }
        .box1 {
            padding: 10px 5px;
        }
        .box1 h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #222;
        }
        .box1 p {
            font-size: 17px;
            line-height: 1.5;
            color: #444;
            margin-bottom: 18px;
        }
        button {
            background-color: #d6a936;
            color: #222;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            height: 25%;
        }
        button:hover {
            background-color: #222;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="image"></div>
            <div class="box1">
                <h1>Wireless Headphones</h1>
                <p>
                    The best wireless headphones for your listening pleasure.
                    Purchase now and enjoy high-quality sound without the hassle of wires.
                </p>
                <button>Buy Now</button>
            </div>
        </div>
    </div>
</body>
</html>
